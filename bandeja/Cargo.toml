[package]
name = "helpert-bandeja"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
lto = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.8"
ksni = "0.2"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
