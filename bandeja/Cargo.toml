[package]
name = "helpert-bandeja"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde_json = "1"
base64 = "0.22"
libloading = "0.8"
ksni = "0.2"

[profile.release]
strip = true
lto = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
