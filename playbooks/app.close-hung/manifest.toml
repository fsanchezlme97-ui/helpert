id = "app.close-hung"
version = "0.1.1"
nombre = "Cerrar un programa congelado"
descripcion = "Un programa se colgó, no responde o no se puede cerrar. Cierra a la fuerza solo ese programa de la persona, para que pueda abrirlo de nuevo. Se pierde lo que no se guardó en ese programa. El parámetro programa es el nombre del programa en una palabra (por ejemplo firefox, chrome, libreoffice, teams, zoom, thunderbird). No sirve si todo el equipo está congelado ni para programas del sistema."
riesgo = "medio"
deshacer = false   # lo que no se guardó en el programa se pierde: el diagnóstico lo advierte
timeout = 60

[sistemas]
linux = "linux.sh"
windows = "windows.ps1"
macos = "macos.sh"

[parametros.programa]
tipo = "texto"
requerido = true
max = 40
pregunta = "¿Qué programa se congeló? Dime su nombre, por ejemplo Firefox o LibreOffice."
