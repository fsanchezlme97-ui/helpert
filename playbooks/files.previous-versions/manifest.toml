id = "files.previous-versions"
version = "0.1.0"
nombre = "Recuperar una versión anterior de un archivo"
descripcion = "La persona guardó cambios por error en un documento. Busca versiones anteriores en las instantáneas del sistema y copia la más reciente al lado con otro nombre. El parámetro archivo es una palabra del nombre."
riesgo = "bajo"
deshacer = false
timeout = 300

[sistemas]
windows = "windows.ps1"

[parametros.archivo]
tipo = "texto"
requerido = true
max = 100
pregunta = "¿Cómo se llama el archivo? Dime una palabra de su nombre, por ejemplo informe."
