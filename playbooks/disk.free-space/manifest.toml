id = "disk.free-space"
version = "0.1.0"
nombre = "Liberar espacio en disco"
descripcion = "El disco está lleno o casi lleno, no se pueden guardar archivos o el sistema avisa de poco espacio. Borra temporales de más de 7 días, cachés del usuario de más de 30 días y registros antiguos del sistema. No toca documentos ni la papelera."
riesgo = "bajo"
deshacer = false   # temporales y cachés no se recuperan; el diagnóstico dice cuánto se libera
timeout = 300

[sistemas]
linux = "linux.sh"
windows = "windows.ps1"
