id = "print.set-default"
version = "0.1.0"
nombre = "Elegir la impresora predeterminada"
descripcion = "Los documentos salen por otra impresora o la persona quiere que una impresora ya instalada sea la que se use siempre. Deja esa impresora como predeterminada del equipo. El parámetro impresora es su nombre en una palabra. No instala impresoras nuevas."
riesgo = "bajo"
deshacer = false
timeout = 30

[sistemas]
linux = "linux.sh"
windows = "windows.ps1"

[parametros.impresora]
tipo = "texto"
requerido = true
max = 100
pregunta = "¿Qué impresora quieres usar siempre? Dime su nombre como aparece al imprimir."
