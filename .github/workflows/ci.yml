# Pruebas en Linux y Windows, y los binarios de Windows listos para empaquetar (despliegue/empaquetar-windows.sh).
# Aquí nunca hay claves: los playbooks y las versiones del agente se firman fuera, donde está la clave privada.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      HELPERT_TEST_DSN: postgresql://postgres:postgres@localhost:5432/helpert_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cd server && uv run pytest -q
      - run: cd agente && cargo test -q
      - name: Archivos de root en la carpeta personal, para que files.home-permissions aplique de verdad
        run: |
          sudo mkdir -p ~/helpert-prueba/sub && sudo touch ~/helpert-prueba/sub/b ~/helpert-prueba/-raro ~/helpert-raro
          sudo ln -s /etc/hosts ~/helpert-prueba/enlace
      - name: Scripts de los playbooks (como root, con aplicar en esta máquina desechable)
        run: python3 playbooks/probar-unix.py --root --aplicar
      - name: files.home-permissions devolvió todo (y no tocó /etc/hosts)
        run: |
          for f in ~/helpert-prueba ~/helpert-prueba/sub ~/helpert-prueba/sub/b ~/helpert-prueba/-raro ~/helpert-raro; do
            [ "$(stat -c %U "$f")" = "$USER" ] || { echo "sigue sin ser de $USER: $f"; exit 1; }
          done
          [ "$(stat -c %U /etc/hosts)" = root ]

  macos:  # no hay agente para macOS todavía: aquí solo se prueban los scripts macos.sh (bash 3.2, herramientas BSD)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archivos de root en la carpeta personal, para que files.home-permissions aplique de verdad
        run: |
          sudo mkdir -p ~/helpert-prueba/sub && sudo touch ~/helpert-prueba/sub/b ~/helpert-prueba/-raro ~/helpert-raro
          sudo ln -s /etc/hosts ~/helpert-prueba/enlace
      - name: Scripts de los playbooks (como root, con aplicar en esta máquina desechable)
        run: python playbooks/probar-unix.py --root --aplicar
      - name: files.home-permissions devolvió todo (y no tocó /etc/hosts)
        run: |
          for f in ~/helpert-prueba ~/helpert-prueba/sub ~/helpert-prueba/sub/b ~/helpert-prueba/-raro ~/helpert-raro; do
            [ "$(stat -f %Su "$f")" = "$USER" ] || { echo "sigue sin ser de $USER: $f"; exit 1; }
          done
          [ "$(stat -f %Su /etc/hosts)" = root ]

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Agente  # con la preferencia, un cargo que falla para el paso (si no, solo cuenta el último de la línea)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cd agente; cargo test -q; cargo build --release -q
      - name: Bandeja
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cd bandeja; cargo test -q; cargo build --release -q
      - name: Scripts de los playbooks (PowerShell 5.1)
        shell: powershell
        run: .\playbooks\probar-windows.ps1 -Aplicar
      - name: Servicio, tubería y servidor de punta a punta
        run: .\despliegue\probar-windows-ci.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: helpert-windows
          path: |
            agente/target/release/helpert-agente.exe
            agente/target/release/helpert.exe
            bandeja/target/release/helpert-bandeja.exe
